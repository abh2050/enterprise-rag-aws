# Application deploy (images + SPA) to an EXISTING environment using short-lived GitHub OIDC federation.
# No long-lived AWS keys. Requires GitHub Environment protection rules (required reviewers) per env.
# Infrastructure (terraform apply) is NOT performed here — it is a reviewed, human-approved action.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: gha-deploy-${{ github.run_id }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64,linux/amd64 # api = arm64, worker = amd64 (ClamAV sidecar is amd64-only)
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
      - name: Roll ECS services to the new image (circuit breaker rolls back on failure)
        run: scripts/deploy-ecs.sh "${{ vars.ECS_CLUSTER }}" "${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"
      - name: Build and publish SPA
        working-directory: apps/web
        env:
          VITE_AUTH_MODE: entra
          VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          VITE_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
        run: |
          npm ci --no-audit --no-fund && npm run build
          aws s3 sync dist "s3://${{ vars.WEB_BUCKET }}" --delete
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
